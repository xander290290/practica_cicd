name: Granja Animales Node.js CI 
on: 
  push:
    branches:
      - main
    pull_request:
      branches:
        - main
jobs: 
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v7 
      - name: Use Node.js
        uses: actions/setup-node@v7 
        with:
          node-version: 20
      - name: Run Yarn 
        run: yarn install